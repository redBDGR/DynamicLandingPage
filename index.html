<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halden</title>
<meta name="description" content="A new home for Halden is being built with care.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDE8DF;
  --ink:#2E2E2C;
  --muted:#6E6A63;
  --accent:#9C7A45;
  --sheen:#B89660;
  --rule:rgba(46,46,44,.18);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#262624;
    --ink:#EDE8DF;
    --muted:#A9A49B;
    --accent:#C8A46B;
    --sheen:#FFF8EC;
    --rule:rgba(237,232,223,.16);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0}
html{background:var(--paper);color:var(--ink)}
body{
  min-height:100svh;display:grid;grid-template-rows:1fr auto;
  padding:clamp(1.25rem,4vw,3rem);
  font:400 1rem/1.6 Jost,"Century Gothic",Futura,sans-serif;
}
a{color:inherit}
a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

main{align-self:end;padding-block:clamp(3rem,10vh,8rem) clamp(2rem,6vh,4rem)}

.mark{
  font-family:"Bodoni Moda",Didot,"Bodoni 72",Georgia,serif;
  font-weight:400;font-size:clamp(4.5rem,21vw,19rem);
  line-height:.85;letter-spacing:-.035em;margin-left:-.04em;
}
@supports (background-clip:text) or (-webkit-background-clip:text){
  .mark{
    background:linear-gradient(100deg,var(--ink) 0 40%,var(--sheen) 50%,var(--ink) 60% 100%) 100% 0/250% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:sweep 2.8s cubic-bezier(.6,0,.2,1) .5s forwards;
  }
}
@keyframes sweep{to{background-position:0 0}}

.intro{
  display:grid;grid-template-columns:minmax(0,34rem) auto;
  justify-content:space-between;align-items:end;gap:2rem;
  margin-top:clamp(2rem,5vw,3.5rem);padding-top:1.5rem;
  border-top:1px solid var(--rule);
}
.intro p{
  font-family:"Bodoni Moda",Georgia,serif;
  font-size:clamp(1.2rem,2.2vw,1.6rem);line-height:1.45;
}
.cta{
  display:inline-block;padding:.85rem 1.6rem;
  border:1px solid var(--ink);text-decoration:none;
  font-weight:500;letter-spacing:.02em;
  transition:background-color .2s,color .2s;
}
.cta:hover{background:var(--ink);color:var(--paper)}

footer{
  display:flex;flex-wrap:wrap;justify-content:space-between;
  gap:.5rem 2rem;color:var(--muted);font-size:.875rem;
}

@media (max-width:40rem){.intro{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.mark{animation:none;background-position:0 0}}
</style>
</head>
<body>
<main>
  <h1 class="mark">Halden</h1>
  <div class="intro">
    <p>A new home for Halden is being built with care. We'd be glad to hear from you in the meantime.</p>
    <a class="cta" href="mailto:hello@example.com.au">Email us</a>
  </div>
</main>
<footer>
  <span>&copy; 2026 Halden</span>
  <span>ABN 00 000 000 000</span>
</footer>
</body>
</html>
